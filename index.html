<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TS Mini Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Mini Shop</h1>
      <p>Demo giỏ hàng viết bằng TypeScript</p>
    </header>

    <main>
      <section class="panel">
        <h2>Sản phẩm</h2>
        <ul id="products"></ul>
      </section>

      <aside class="panel cart">
        <h2>Giỏ hàng</h2>
        <ul id="cart"></ul>
        <div class="total">
          <span>Tổng cộng</span>
          <strong id="total">0 ₫</strong>
        </div>
        <button id="btn-pay">Thanh toán</button>
        <p id="msg"></p>
      </aside>
    </main>

    <script type="module" src="dist/main.js"></script>
  </body>
</html>
