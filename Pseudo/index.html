    <!-- 1. :hover -> Khi chuột đang di vào phần tử
     2. :focus -> Khi phần tử đang được chọn (click hoặc tab)
     3. :active -> Khi phần tử đang bị nhấn giữ
     4. :first-child -> Khi phần tử là con đầu tiên của cha
     5. :last-child -> Khi phần tử là con cuối cùng của cha
     6. :nth-child(n) -> Khi phần tử ở vị trí thứ n theo công thức
     7. :not(...) -> Khi phần tử không khớp điều kiện trong ngoặc -->
